<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>MINARI 인증번호</title>
  <style>
    body {
      background: #f5f5f5;
      font-family: 'Noto Sans KR', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      border-radius: 20px;
      width: 360px;
      padding: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .code-box {
      background: #1b1b1b;
      color: #ccff00;
      font-size: 32px;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .description {
      font-size: 14px;
      color: #444;
      line-height: 1.4;
    }

    .icons {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 30px;
    }

    .icon {
      width: 32px;
      height: 32px;
      opacity: 0.4;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="logo"><img src="icon.png" width="32" height="32"> MINARI</div>
  <div class="section-title"><img src="icon.png" width="24" height="24"> 인증번호</div>
  <div class="code-box" th:text="${authCode}">123456</div>
  <div class="description">
    미나리 알림을 위한 인증번호입니다.<br>
    상단의 인증번호를 입력하여 이메일 주소 인증을 완료해 주세요.
  </div>
</div>
</body>
</html>
