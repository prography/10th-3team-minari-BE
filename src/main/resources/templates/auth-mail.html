<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/html" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>MINARI 인증번호</title>
</head>
<body style="margin:0; padding:0; background:#f5f5f5; font-family:system-ui, sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5; width:100%; padding: 40px 0;">
  <tr>
    <td align="center">
      <table width="360" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:20px; padding:30px; box-shadow:0 4px 10px rgba(0,0,0,0.1);">
        <tr>
          <td style="font-weight:bold; font-size:24px; display:flex; align-items:center;">
            <img src="https://minari-img.s3.ap-northeast-2.amazonaws.com/icon.png" width="32" height="32" alt="minari" style="vertical-align:middle; margin-right:8px;">
            MINARI
          </td>
        </tr>
        <tr>
          <td style="padding-top:20px; font-weight:bold; font-size:18px; display:flex; align-items:center;">
            <img src="https://minari-img.s3.ap-northeast-2.amazonaws.com/icon.png" width="24" height="24" alt="auth" style="vertical-align:middle; margin-right:8px;">
            인증번호
          </td>
        </tr>
        <tr>
          <td align="center" style="background:#1b1b1b; color:#b4dd2b; font-size:28px; font-weight:600; padding:20px; border-radius:10px; margin:20px 0;">
            <span th:text="${authCode}">123456</span>
          </td>
        </tr>
        <tr>
          <td style="font-size:12px; color:#444444; line-height:1.4; font-weight:400;">
            <div style="margin-top:12px; margin-bottom:4px;">미나리 알림을 위한 인증번호에요.</div>
            <div style="margin-bottom:4px;">상단의 인증번호를 입력하여 이메일 주소 인증을 완료해 주세요.</div>
            <div>한 번 받은 인증번호는 3분간 사용할 수 있어요.</div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
