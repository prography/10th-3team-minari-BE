spring:
  application:
    name: minari
  h2:
    console:
      enabled: true
      path: /h2-console

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:db;MODE=MYSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  mail:
    host: smtp.gmail.com       # SMTP 서버 호스트
    port: 587                  # SMTP 서버 포트
    username: testestest    # SMTP 서버 로그인 아이디
    password: testestest # SMTP 서버 로그인 비밀번호
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
      protocol: smtp
      default-encoding: UTF-8
  thymeleaf:
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
jwt:
  secret: jwtsecretjwtsecretjwtsecretjwtsecretjwtsecret
  expiration: 3600000
naver:
  client:
    id: thisisnotidㅋ
    secret: thisisnotsecretㅋ