plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.prography'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	//spring
	implementation 'org.springframework.boot:spring-boot-starter-web'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
//	testImplementation "org.junit.platform:junit-platform-launcher:1.11.0"
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	//webserver
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

	//h2
	runtimeOnly 'com.h2database:h2'

	//lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// fixture monkey
//	testRuntimeOnly("org.junit.platform:junit-platform-launcher:{version}")
	testImplementation("com.navercorp.fixturemonkey:fixture-monkey-starter:1.1.11")

	// webflux
//	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework:spring-webflux'

	// postgresql
	implementation 'org.postgresql:postgresql:42.7.5'

	// jwt
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5' // Jackson 기반 파싱

	//swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

	// google smtp
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// thymeleaf
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.thymeleaf:thymeleaf'

	// validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	//ffmpeg
	implementation("ws.schild:jave-core:3.3.1")

}

tasks.named('test') {
	useJUnitPlatform()
}
